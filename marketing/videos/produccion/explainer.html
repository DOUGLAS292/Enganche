<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;700;800&family=IBM+Plex+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
  :root { --marca:#04253a; --acento:#ff7f00; --acento2:#e08a00; --azul:#2f76a3; --bg:#c7def2; --texto:#12222c; }
  html, body { margin:0; width:1080px; height:1920px; overflow:hidden; font-family: Manrope, sans-serif; color:var(--texto); }
  body { background:
      radial-gradient(800px 700px at 90% 8%, rgba(255,127,0,.16), transparent 60%),
      radial-gradient(900px 900px at 0% 100%, rgba(47,118,163,.28), transparent 60%),
      linear-gradient(180deg, #eaf4fc 0%, #c7def2 55%, #a9cbe6 100%); }
  .capa { position:absolute; inset:0; opacity:0; }

  /* Encabezado */
  .cab { position:absolute; left:80px; right:80px; top:58px; display:flex; align-items:center; gap:22px; }
  .cab img { width:78px; height:78px; border-radius:20px; box-shadow:0 10px 26px rgba(4,37,58,.25); }
  .cab .kick { font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:24px; letter-spacing:3px; color:var(--azul); }
  .cab .tit { font-family:Unbounded, sans-serif; font-weight:800; font-size:46px; letter-spacing:-1px; color:var(--marca); margin-top:4px; }
  .dots { position:absolute; right:80px; top:88px; display:flex; gap:10px; }
  .dot { width:14px; height:14px; border-radius:7px; background:rgba(4,37,58,.18); }
  .dot.on { background:var(--acento); width:38px; }

  /* Celular */
  .phone { position:absolute; left:194px; top:186px; width:692px; height:1530px; border-radius:76px; background:#0b1620;
           box-shadow:0 50px 90px rgba(4,37,58,.45), inset 0 0 0 3px #22313b; }
  .screen { position:absolute; left:16px; top:16px; width:660px; height:1498px; border-radius:60px; overflow:hidden; background:#c7def2; }
  .shot { position:absolute; left:0; top:78px; width:660px; opacity:0; }
  .status { position:absolute; left:0; right:0; top:0; height:78px; z-index:45; background:#eaf4fc; display:flex; align-items:center; justify-content:space-between; padding:0 56px; box-sizing:border-box; font-weight:800; font-size:24px; color:#12222c; }
  .status i { display:inline-block; width:40px; height:18px; border:2.5px solid #12222c; border-radius:5px; position:relative; }
  .status i::after { content:''; position:absolute; left:2px; top:2px; bottom:2px; width:70%; background:#12222c; border-radius:2px; }
  .shot img { width:660px; display:block; transform-origin:50% 0; }
  .notch { position:absolute; left:50%; top:30px; width:150px; height:38px; margin-left:-75px; border-radius:20px; background:#0b1620; z-index:50; }
  .tap { position:absolute; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:60px; border:6px solid var(--acento);
         background:rgba(255,127,0,.18); opacity:0; z-index:40; }

  /* Subtítulo */
  .cap { position:absolute; left:90px; right:90px; top:1748px; min-height:120px; display:flex; align-items:center; justify-content:center; text-align:center;
         padding:22px 34px; box-sizing:border-box; border-radius:36px; background:var(--marca); color:#fff;
         font-family:Manrope, sans-serif; font-weight:800; font-size:44px; line-height:1.2; box-shadow:0 18px 40px rgba(4,37,58,.35); opacity:0; }
  .cap b { color:#ffad01; font-weight:800; }

  /* Portada y cierre */
  .card { background:
      radial-gradient(900px 800px at 85% 10%, rgba(255,127,0,.30), transparent 60%),
      radial-gradient(900px 900px at 0% 100%, rgba(47,118,163,.45), transparent 60%),
      linear-gradient(180deg, #06314d 0%, #04253a 60%, #021827 100%); color:#fff; }
  .card .ico { position:absolute; left:50%; top:470px; width:300px; height:300px; margin-left:-150px; border-radius:70px;
               box-shadow:0 40px 80px rgba(0,0,0,.45); }
  .card .k { position:absolute; left:0; right:0; top:850px; text-align:center; font-family:'IBM Plex Mono', monospace; font-weight:600;
             font-size:30px; letter-spacing:6px; color:#ffad01; }
  .card .t { position:absolute; left:90px; right:90px; top:920px; text-align:center; font-family:Unbounded, sans-serif; font-weight:800;
             font-size:96px; line-height:1.05; letter-spacing:-2px; }
  .card .t .o { color:var(--acento); }
  .card .s { position:absolute; left:110px; right:110px; top:1240px; text-align:center; font-weight:600; font-size:42px; line-height:1.35; color:rgba(255,255,255,.82); }
  .card .btn { position:absolute; left:50%; top:1520px; transform:translateX(-50%); padding:30px 70px; border-radius:60px;
               background:linear-gradient(135deg,#ff9a2e,#ff7f00); color:#04253a; font-weight:800; font-size:44px; white-space:nowrap;
               box-shadow:0 20px 50px rgba(255,127,0,.45); }
  .card .marca { position:absolute; left:0; right:0; bottom:110px; text-align:center; font-family:Unbounded, sans-serif; font-weight:800;
                 font-size:44px; color:#fff; }
  .card .marca span { color:var(--acento); }
</style>
</head>
<body>

<div class="capa" id="pantallas">
  <div class="cab">
    <img src="brand/icon.png" alt="">
    <div>
      <div class="kick" id="kick"></div>
      <div class="tit" id="tit"></div>
    </div>
  </div>
  <div class="dots" id="dots"></div>
  <div class="phone">
    <div class="screen" id="screen">
      <div class="status"><span>9:41</span><span><i></i></span></div>
      <div class="notch"></div>
      <div class="tap" id="tap"></div>
    </div>
  </div>
  <div class="cap" id="cap"></div>
</div>

<div class="capa card" id="intro">
  <img class="ico" src="brand/icon.png" alt="" id="introIco">
  <div class="k" id="introK"></div>
  <div class="t" id="introT"></div>
  <div class="s" id="introS"></div>
  <div class="marca">Enganche<span>.</span></div>
</div>

<div class="capa card" id="outro">
  <img class="ico" src="brand/icon.png" alt="" id="outroIco">
  <div class="k">ENGANCHE</div>
  <div class="t" id="outroT">Todo el gremio, <span class="o">enganchado.</span></div>
  <div class="s" id="outroS">Publica, postúlate y trabaja con quien está cerca de ti.</div>
  <div class="btn" id="outroBtn">Entra gratis con tu celular</div>
</div>

<script>
const CFG = __CONFIG__;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const inOut = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const k = (l, s, d) => ease((l - s) / d);

$('kick').textContent = `CÓMO USAR ENGANCHE · ${CFG.num} DE ${CFG.total}`;
$('tit').textContent = CFG.title;
$('introK').textContent = `CÓMO USAR ENGANCHE · ${CFG.num} DE ${CFG.total}`;
$('introT').innerHTML = CFG.introTitle;
$('introS').textContent = CFG.introSub;

const screens = CFG.steps.map((s, i) => ({ ...s, i })).filter((s) => s.type === 'screen');
screens.forEach((s, n) => {
  const d = document.createElement('div');
  d.className = 'shot';
  d.id = 'shot' + s.i;
  d.style.zIndex = 10 + n;
  d.innerHTML = `<img src="${s.img}" alt="">`;
  $('screen').appendChild(d);
  const dot = document.createElement('div');
  dot.className = 'dot';
  dot.id = 'dot' + s.i;
  $('dots').appendChild(dot);
});

function screenStep(idx, local, dur) {
  const s = CFG.steps[idx];
  const order = screens.findIndex((x) => x.i === idx);
  screens.forEach((x, n) => {
    const el = $('shot' + x.i);
    if (n === order) el.style.opacity = clamp(local / 0.35);
    else if (n === order - 1) el.style.opacity = 1;
    else el.style.opacity = 0;
    $('dot' + x.i).className = 'dot' + (n === order ? ' on' : '');
  });
  const img = $('shot' + idx).querySelector('img');
  const H = img.naturalHeight * (660 / img.naturalWidth);
  let ty = 0, sc = 1, ox = 50, oy = 0;
  if (s.scroll && H > 1420) {
    ty = -(H - 1420) * inOut((local - 0.8) / Math.max(1, dur * 0.75 - 0.8));
  } else if (s.focus) {
    sc = 1 + (s.focus.s - 1) * inOut((local - 0.3) / Math.max(1, dur - 0.6));
    ox = s.focus.x; oy = s.focus.y;
  }
  img.style.transformOrigin = `${ox}% ${oy}%`;
  img.style.transform = `translateY(${ty.toFixed(1)}px) scale(${sc.toFixed(4)})`;

  const tap = $('tap');
  if (s.tap) {
    const tl = local - (s.tapAt ?? 1.0);
    const on = tl > 0 && tl < 1.1;
    tap.style.left = (s.tap.x / 100 * 660) + 'px';
    tap.style.top = (78 + s.tap.y / 100 * 1428) + 'px';
    tap.style.opacity = on ? (1 - clamp(tl / 1.1)) : 0;
    tap.style.transform = `scale(${(0.5 + 0.8 * clamp(tl / 1.1)).toFixed(3)})`;
  } else {
    tap.style.opacity = 0;
  }
  const cap = $('cap');
  cap.innerHTML = `<span>${s.caption}</span>`;
  const v = k(local, 0.15, 0.5);
  cap.style.opacity = v;
  cap.style.transform = `translateY(${((1 - v) * 30).toFixed(1)}px)`;
}

function cardStep(prefix, local) {
  const v = k(local, 0.05, 0.8);
  $(prefix + 'Ico').style.transform = `scale(${(0.8 + 0.2 * v).toFixed(3)}) rotate(${((1 - v) * -8).toFixed(2)}deg)`;
  $(prefix + 'Ico').style.opacity = v;
  ['T', 'S'].forEach((x, i) => {
    const el = $(prefix + x);
    const w = k(local, 0.35 + i * 0.3, 0.7);
    el.style.opacity = w;
    el.style.transform = `translateY(${((1 - w) * 40).toFixed(1)}px)`;
  });
  if (prefix === 'intro') {
    const w = k(local, 0.2, 0.6);
    $('introK').style.opacity = w;
  } else {
    const w = k(local, 1.0, 0.6);
    $('outroBtn').style.opacity = w;
    $('outroBtn').style.transform = `translateX(-50%) scale(${(0.9 + 0.1 * w).toFixed(3)})`;
  }
}

function render(t) {
  let idx = CFG.tl.findIndex((s) => t >= s.start && t < s.end);
  if (idx < 0) idx = CFG.tl.length - 1;
  const seg = CFG.tl[idx];
  const local = t - seg.start;
  const dur = seg.end - seg.start;
  const type = CFG.steps[idx].type;
  const fadeIn = clamp(local / 0.35);
  $('intro').style.opacity = type === 'intro' ? 1 : 0;
  $('outro').style.opacity = type === 'outro' ? fadeIn : 0;
  $('pantallas').style.opacity = type === 'screen' ? (idx > 0 && CFG.steps[idx - 1].type !== 'screen' ? fadeIn : 1) : (type === 'outro' ? 1 - fadeIn : 0);
  if (type === 'screen') screenStep(idx, local, dur);
  else cardStep(type, local);
}
window.render = render;
</script>
</body>
</html>
